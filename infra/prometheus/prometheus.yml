global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { environment: local, system: projectx }

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  - job_name: projectx-core
    metrics_path: /metrics
    static_configs:
      - targets: ['ledger:8000']
        labels: { module_id: 03-ledger, tier: T0 }
      - targets: ['market-data:8000']
        labels: { module_id: 06-market-data, tier: T1 }
      - targets: ['pricing:8000']
        labels: { module_id: 07-pricing, tier: T1 }
      - targets: ['oms:8000']
        labels: { module_id: 10-oms, tier: T0 }

  - job_name: projectx-edge
    metrics_path: /metrics
    static_configs:
      - targets: ['client-api:8000']
        labels: { module_id: 19-client-api, tier: T4 }

  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8888'] }]

  # below the venue minimum that could never be closed). G6 positions are
  # folded from the same journal the ledger replays. G7 the ledger kill
  # compares the position to the acknowledged fills.
  05-position: [G0, G1, G2, G3, G4, G5, G6, G7]

  # G3 feed_laws. G4 INV-050..054 executed. G6 the recorded feed replays

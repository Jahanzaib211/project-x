# =============================================================================
# GATE RESULTS
# =============================================================================
# Which modules have passed which gates. Read by scripts/check_gates.py to
# decide whether anything downstream is allowed to proceed.
#
# A module absent from this map has passed nothing.
#
# In steady state CI writes this file, keyed to an artifact digest. The entries
# below were produced by the Phase 0 bootstrap run on a developer machine and
# are recorded here so the gate mechanism has real data to enforce against. Each
# one corresponds to a check that was actually executed and observed to pass —
# nothing here is aspirational.
#
# Hand-editing this file outside the documented emergency procedure is a process
# violation, and because it is in git, it is a visible one.
# See docs/runbooks/emergency-change.md.
# =============================================================================
version: 1


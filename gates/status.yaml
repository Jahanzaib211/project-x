# =============================================================================
# GATE RESULTS
# =============================================================================
# Which modules have passed which gates. Read by scripts/check_gates.py to
# decide whether anything downstream is allowed to proceed.
#
# A module absent from this map has passed nothing.
#
# In steady state CI writes this file, keyed to an artifact digest. The entries
# below were produced by the Phase 0 bootstrap run on a developer machine and
# are recorded here so the gate mechanism has real data to enforce against. Each
# one corresponds to a check that was actually executed and observed to pass —
# nothing here is aspirational.
#
# Hand-editing this file outside the documented emergency procedure is a process
# violation, and because it is in git, it is a visible one.
# See docs/runbooks/emergency-change.md.
# =============================================================================
version: 1

passed:
  # G0 cargo fmt --check + cargo check   G1 clippy -D warnings + banned patterns
  # G2 cargo test --workspace and the node:test suites of every JS package
  # G4 INV-900..902 executed by scripts/check_foundation_invariants.sh:
  # dependencies pinned, core crates dependency-free, no secret tracked, the
  # secret scanner verified against a planted canary, runtime images non-root
  # and free of a package manager (feed-gateway and mt5-sim included).
  00-foundation: [G0, G1, G2, G4]

  # G3 property suite, ~100k generated cases. G4 INV-001..005 executed.
  01-domain-kernel: [G0, G1, G2, G3, G4]

  # G4 INV-010..014 executed. G6 replay suite: replay from genesis identical,
  # snapshot+tail == full replay, duplicate delivery inert, time not content.
  # G5 tests/integration/tests/live_stack.rs against the composed stack: the
  # journal the ledger serves is unique, strictly increasing and stable under
  # a second read; the trial balance it serves sums to zero per currency.
  02-event-kernel: [G0, G1, G2, G3, G4, G5, G6]

  # ---------------------------------------------------------------------------
  # The financial core, built in dependency order. Every entry below records
  # only gates that were actually executed on this tree.
  #
  # G3 is the seeded property harness in tests/invariants — money_laws,
  # event_laws, feed_laws, core_laws, oms_laws, pricing_laws — thousands of
  # generated cases per law, laws asserted after every step, failures
  # reproducible from the printed seed. Not a shrinking framework; a generator
  # with a seed, which is what the gate asks for.
  # G6 is tests/replay: the real core written to a journal, reopened and
  # compared field for field, twice in separate processes by CI.
  # G7 is scripts/chaos_suite.sh against the composed stack: the database,
  # market-data, the ledger (under a burst of orders) and the OMS killed with
  # SIGKILL and restarted; pricing killed and observed failing closed.
  # G8 is scripts/check_security.sh, including the core services' own
  # surfaces probed with malformed, oversized and out-of-bounds input.
  # G9 is scripts/check_performance.sh: the read paths and the order path.
  # ---------------------------------------------------------------------------

  # G4 INV-020..024 executed. G5 tests/e2e drives orders through this service
  # from a browser. G6 core_replay: accounts of both modes, credits, status
  # changes, fills, refusals and every id come back from the journal; a
  # retried key after a restart is the same order. G7 killed mid-order: every
  # acknowledged fill survived, the book balanced, in-flight keys retried to
  # exactly one order each. G8 surfaces probed, image scanned.
  03-ledger: [G0, G1, G2, G3, G4, G5, G6, G7, G8]

  # G4 INV-030..035 executed. G3 core_laws: free margin, the lifecycle

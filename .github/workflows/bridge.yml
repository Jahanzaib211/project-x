# =============================================================================
# MT5 bridge image — built and published outside the gate graph
# =============================================================================
# The bridge image (Ubuntu + WineHQ 10.0 + the MetaTrader 5 terminal +
# Windows Python + the MetaTrader5 package) is ~6 GB and takes tens of
# minutes to build; nothing in a gate depends on it (the contract suite runs
# against mt5-sim). It is rebuilt when its sources change on main, or on
# demand, and published as ghcr.io/<owner>/projectx/mt5-bridge.
# =============================================================================
name: MT5 bridge image

on:
  push:
    branches: [main]
    paths:
      - "services/mt5-bridge/**"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  bridge:
    name: Build and publish mt5-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The hosted runner has ~14 GB free; the build needs room for Wine's
      # apt payload, the terminal installer and a 6 GB image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          cp .env.example .env
          docker compose --profile external build mt5-bridge

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          make images-push IMAGE_OWNER="$owner" IMAGE_TAG="${GITHUB_SHA::7}" SVCS=mt5-bridge
